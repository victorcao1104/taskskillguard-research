[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "taskskillguard-research"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["z3-solver>=4.13", "jsonschema>=4.23"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
