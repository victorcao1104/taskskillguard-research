name: Offline research checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r configs/requirements-lock.txt
      - run: mkdir -p work
      - run: python -m pytest -q --basetemp work/ci-tests
      - run: python scripts/verify_release.py
