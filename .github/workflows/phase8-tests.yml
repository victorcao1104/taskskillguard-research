name: Phase eight factorized facts and economic recovery
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  phase8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r configs/requirements-lock.txt -r configs/phase5-requirements.txt
      - run: mkdir -p work
      - run: python -m pytest -q --basetemp work/phase8-ci-tests
      - run: python scripts/verify_phase8.py
